<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一森室內設計 ESAN | 尊爵裝潢預算估算器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #2b3830;
            --card-bg: #faf9f6;
            --gold-primary: #c5a880;
            --gold-dark: #a8895e;
            --text-dark: #1f2722;
            --text-muted: #5e6b63;
            --border-color: #e2ded7;
            --line-green: #06c755;
        }

        body {
            font-family: 'Noto Serif TC', -apple-system, BlinkMacSystemFont, "Segoe UI", serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#3a4a40 1px, transparent 1px);
            background-size: 24px 24px;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            color: var(--text-dark);
        }

        .calculator-card {
            background: var(--card-bg);
            padding: 36px 32px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(197, 168, 128, 0.3);
            position: relative;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-logo-img {
            max-width: 140px;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .page-title {
            font-size: 1.2rem;
            color: var(--text-dark);
            text-align: center;
            margin: 18px 0 6px 0;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .page-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.88rem;
            letter-spacing: 0.02em;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            color: var(--text-dark);
            background-color: #ffffff;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 3px rgba(197, 168, 128, 0.25);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.1em;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 6px;
            box-shadow: 0 4px 12px rgba(168, 137, 94, 0.25);
            font-family: inherit;
        }

        button:hover {
            opacity: 0.92;
        }

        button:active {
            transform: scale(0.99);
        }

        .result {
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid var(--border-color);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .total-price {
            font-size: 1.9rem;
            color: var(--gold-dark);
            font-weight: 700;
            margin: 6px 0 16px 0;
            letter-spacing: 0.02em;
        }

        .detail-list {
            background: #f2efe9;
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-dark);
        }

        .detail-list p {
            margin: 0 0 8px 0;
            font-weight: 600;
            color: var(--text-dark);
        }

        .detail-list ul {
            padding-left: 18px;
            margin: 0;
            line-height: 1.8;
        }

        .detail-list li span {
            color: var(--gold-dark);
            font-weight: 700;
        }

        .note {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 16px;
            margin-bottom: 0;
            line-height: 1.5;
        }

        /* LINE 按鈕獨立樣式 */
        .line-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--line-green);
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.92rem;
            font-weight: 600;
            margin-top: 18px;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(6, 199, 85, 0.2);
        }

        .line-btn:hover {
            opacity: 0.9;
        }

        .line-btn:active {
            transform: scale(0.99);
        }

        .line-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <!-- 品牌 Logo 區域 -->
        <div class="brand-header">
            <img src="logo.png" alt="一森室內設計 ESAN INTERIOR DESIGN" class="brand-logo-img">
        </div>

        <div class="page-title">尊爵裝潢預算估算器</div>
        <p class="page-subtitle">為您專屬訂製的一森極致空間</p>
        
        <!-- 輸入表單 -->
        <div class="form-group">
            <label for="ping">室內坪數（不含陽台與公設）：</label>
            <input type="number" id="ping" placeholder="請輸入坪數（例：25）" min="1" value="20">
        </div>

        <div class="form-group">
            <label for="houseType">屋齡與工程類型：</label>
            <select id="houseType">
                <option value="new">一森尊爵新成屋（100 萬起跳）</option>
                <option value="old">一森極致老屋翻新（200 萬起跳）</option>
                <option value="soft">微裝修 / 軟裝設計（60 萬起跳）</option>
            </select>
        </div>

        <!-- 風格選擇欄位 -->
        <div class="form-group">
            <label for="styleType">偏好設計風格：</label>
            <select id="styleType">
                <option value="1.0">現代極簡風 / 北歐風（標準造價）</option>
                <option value="1.15">一森自然木質風 / 日式侘寂（+15%）</option>
                <option value="1.3">輕奢飯店風 / 莫蘭迪美式（+30%）</option>
                <option value="1.5">頂級尊爵奢華風 / 高級訂製（+50%）</option>
            </select>
        </div>

        <button onclick="calculateBudget()">開始您的專屬預算試算</button>

        <!-- 結果展示區 -->
        <div class="result" id="resultBox" style="display: none;">
            <div class="result-title">預估總費用範圍</div>
            <div class="total-price" id="totalPrice">$0</div>
            
            <div class="detail-list">
                <p>建議預算分配比例：</p>
                <ul>
                    <li>一森林感基礎與木作：<span id="hardBuild">$0</span>（約 60%）</li>
                    <li>頂級家電與傢俱：<span id="furniture">$0</span>（約 30%）</li>
                    <li>極致軟裝與監工：<span id="decor">$0</span>（約 10%）</li>
                </ul>
            </div>
            
            <p class="note">※ 備註：此結果為基礎估算，實際費用仍需依現場丈量結果、設計細節及指定建材為準。</p>
            
            <!-- 加 LINE 諮詢按鈕（請將 href 改為您的 LINE 官方帳號連結，例如 https://lin.ee/xxxxx） -->
            <a href="https://line.me" target="_blank" class="line-btn">
                <svg class="line-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 5.82 2 10.53c0 4.23 3.61 7.78 8.48 8.42.33.07.78.22.89.51.1.26.07.67.03.94l-.14.86c-.04.26-.2.1.03 1.18.23.23 1.25.75 2.06.32 2.74-1.61 7.65-4.5 7.65-11.23C22 5.82 17.52 2 12 2z"/>
                </svg>
                加 LINE 預約一森設計師現場丈量
            </a>
        </div>
    </div>

    <script>
        function calculateBudget() {
            const pingInput = document.getElementById('ping').value;
            const ping = parseFloat(pingInput);
            const houseType = document.getElementById('houseType').value;
            const styleMultiplier = parseFloat(document.getElementById('styleType').value);

            if (!ping || ping <= 0) {
                alert("請輸入正確的坪數！");
                return;
            }

            let baseCost = 0;
            let costPerPing = 0;

            if (houseType === 'new') {
                baseCost = 1000000;
                costPerPing = 60000;
            } else if (houseType === 'old') {
                baseCost = 2000000;
                costPerPing = 90000;
            } else if (houseType === 'soft') {
                baseCost = 600000;
                costPerPing = 30000;
            }

            const rawEstimate = baseCost + (ping * costPerPing);
            const totalEstimate = Math.round(rawEstimate * styleMultiplier);
            
            const hardBuild = Math.round(totalEstimate * 0.6);
            const furniture = Math.round(totalEstimate * 0.3);
            const decor = Math.round(totalEstimate * 0.1);

            document.getElementById('totalPrice').innerText = `約 $${totalEstimate.toLocaleString()} 元起`;
            document.getElementById('hardBuild').innerText = `$${hardBuild.toLocaleString()} 元`;
            document.getElementById('furniture').innerText = `$${furniture.toLocaleString()} 元`;
            document.getElementById('decor').innerText = `$${decor.toLocaleString()} 元`;

            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
