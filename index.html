<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>室內裝潢預算線上估算器</title>
    <style>
        /* 全局樣式 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 主卡片容器 */
        .calculator-card {
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 480px;
            width: 100%;
        }

        h2 {
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.6rem;
            text-align: center;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 28px;
            text-align: center;
            line-height: 1.4;
        }

        /* 表單區域 */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 0.95rem;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            color: #0f172a;
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* 按鈕樣式 */
        button {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* 計算結果區塊 */
        .result {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 2px dashed #e2e8f0;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result h3 {
            margin: 0;
            color: #475569;
            font-size: 1rem;
            font-weight: 600;
        }

        .total-price {
            font-size: 2rem;
            color: #dc2626;
            font-weight: 700;
            margin: 8px 0 16px 0;
        }

        .detail-list {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #334155;
        }

        .detail-list p {
            margin: 0 0 8px 0;
            font-weight: 600;
        }

        .detail-list ul {
            padding-left: 20px;
            margin: 0;
            line-height: 1.6;
        }

        .note {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 16px;
            margin-bottom: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>室內裝潢預算估算器</h2>
        <p class="subtitle">輸入您的坪數與需求，快速試算預估費用</p>
        
        <!-- 坪數輸入 -->
        <div class="form-group">
            <label for="ping">室內坪數（不含陽台與公設）：</label>
            <input type="number" id="ping" placeholder="請輸入坪數（例：25）" min="1" value="20">
        </div>

        <!-- 屋況選擇 -->
        <div class="form-group">
            <label for="houseType">屋齡與工程類型：</label>
            <select id="houseType">
                <option value="80000">新成屋 / 預售屋（約 6~10 萬/坪）</option>
                <option value="120000">中古屋 / 老屋翻新（約 10~15 萬/坪）</option>
                <option value="50000">局部裝修 / 軟裝設計（約 4~6 萬/坪）</option>
            </select>
        </div>

        <!-- 計算按鈕 -->
        <button onclick="calculateBudget()">開始計算預算</button>

        <!-- 結果顯示區 -->
        <div class="result" id="resultBox" style="display: none;">
            <h3>預估總費用範圍</h3>
            <div class="total-price" id="totalPrice">$0</div>
            
            <div class="detail-list">
                <p>建議預算分配比例：</p>
                <ul>
                    <li>基礎工程與木作裝修（約 60%）：<br><strong id="hardBuild">$0</strong></li>
                    <li>家具與家電採購（約 30%）：<br><strong id="furniture">$0</strong></li>
                    <li>軟裝佈置與監工服務（約 10%）：<br><strong id="decor">$0</strong></li>
                </ul>
            </div>
            
            <p class="note">※ 備註：此結果為基礎市場行情推估，實際費用仍需依現場丈量結果、設計細節及指定建材為準。</p>
        </div>
    </div>

    <script>
        function calculateBudget() {
            // 取得輸入值
            const pingInput = document.getElementById('ping').value;
            const ping = parseFloat(pingInput);
            const costPerPing = parseFloat(document.getElementById('houseType').value);

            // 驗證輸入
            if (!ping || ping <= 0) {
                alert("請輸入正確的坪數！");
                return;
            }

            // 計算總預算與分配
            const totalEstimate = ping * costPerPing;
            const hardBuild = Math.round(totalEstimate * 0.6);
            const furniture = Math.round(totalEstimate * 0.3);
            const decor = Math.round(totalEstimate * 0.1);

            // 格式化數字並渲染至網頁
            document.getElementById('totalPrice').innerText = `約 $${totalEstimate.toLocaleString()} 元起`;
            document.getElementById('hardBuild').innerText = `$${hardBuild.toLocaleString()} 元`;
            document.getElementById('furniture').innerText = `$${furniture.toLocaleString()} 元`;
            document.getElementById('decor').innerText = `$${decor.toLocaleString()} 元`;

            // 顯示結果區塊
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
