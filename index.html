<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一森室內設計 ESAN | 尊爵裝潢預算估算器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #2b3830;
            --card-bg: #faf9f6;
            --gold-primary: #c5a880;
            --gold-dark: #a8895e;
            --gold-light: #e6d3b8;
            --text-dark: #1f2722;
            --text-muted: #5e6b63;
            --border-color: #e2ded7;
        }

        body {
            font-family: 'Noto Serif TC', -apple-system, BlinkMacSystemFont, "Segoe UI", serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#3a4a40 1px, transparent 1px);
            background-size: 24px 24px;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            color: var(--text-dark);
        }

        .calculator-card {
            background: var(--card-bg);
            padding: 36px 32px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(197, 168, 128, 0.3);
            position: relative;
        }

        /* 品牌的 Logo SVG 圖示與文字 */
        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        /* 調整 Logo 尺寸，使其更精緻小巧 */
        .brand-logo-svg {
            width: 42px;
            height: auto;
            margin: 0 auto 10px auto;
            display: block;
        }

        .brand-title {
            font-size: 1.25rem;
            letter-spacing: 0.2em;
            color: var(--gold-dark);
            font-weight: 700;
            margin: 0;
            text-indent: 0.2em;
        }

        .brand-subtitle {
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: var(--gold-primary);
            margin-top: 4px;
            font-weight: 400;
            text-transform: uppercase;
            text-indent: 0.25em;
        }

        .page-title {
            font-size: 1.2rem;
            color: var(--text-dark);
            text-align: center;
            margin: 18px 0 6px 0;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .page-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        /* 表單區域 */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.88rem;
            letter-spacing: 0.02em;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            color: var(--text-dark);
            background-color: #ffffff;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 3px rgba(197, 168, 128, 0.25);
        }

        /* 按鈕樣式 */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.1em;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 6px;
            box-shadow: 0 4px 12px rgba(168, 137, 94, 0.25);
            font-family: inherit;
        }

        button:hover {
            opacity: 0.92;
        }

        button:active {
            transform: scale(0.99);
        }

        /* 結果展示區 */
        .result {
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid var(--border-color);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .total-price {
            font-size: 1.9rem;
            color: var(--gold-dark);
            font-weight: 700;
            margin: 6px 0 16px 0;
            letter-spacing: 0.02em;
        }

        .detail-list {
            background: #f2efe9;
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-dark);
        }

        .detail-list p {
            margin: 0 0 8px 0;
            font-weight: 600;
            color: var(--text-dark);
        }

        .detail-list ul {
            padding-left: 18px;
            margin: 0;
            line-height: 1.8;
        }

        .detail-list li span {
            color: var(--gold-dark);
            font-weight: 700;
        }

        .note {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 16px;
            margin-bottom: 0;
            line-height: 1.5;
        }

        .contact-btn {
            display: block;
            text-align: center;
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-dark);
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-top: 16px;
            transition: all 0.2s;
        }

        .contact-btn:hover {
            background: var(--gold-primary);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <!-- 品牌標誌與抬頭 -->
        <div class="brand-header">
            <svg class="brand-logo-svg" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- 正確的一森幾何造型 Logo -->
                <path d="M48 5 L55 5 L43 52 L82 52 L18 115 L36 62 L12 62 Z" fill="url(#goldGradient)"/>
                <defs>
                    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#E6D3B8"/>
                        <stop offset="50%" stop-color="#C5A880"/>
                        <stop offset="100%" stop-color="#A8895E"/>
                    </linearGradient>
                </defs>
            </svg>
            <div class="brand-title">一森室內設計</div>
            <div class="brand-subtitle">ESAN INTERIOR DESIGN</div>
        </div>

        <div class="page-title">尊爵裝潢預算估算器</div>
        <p class="page-subtitle">為您專屬訂製的一森極致空間</p>
        
        <!-- 輸入表單 -->
        <div class="form-group">
            <label for="ping">室內坪數（不含陽台與公設）：</label>
            <input type="number" id="ping" placeholder="請輸入坪數（例：25）" min="1" value="20">
        </div>

        <div class="form-group">
            <label for="houseType">屋齡與工程類型：</label>
            <select id="houseType">
                <option value="150000">一森尊爵新成屋（約 12~18 萬/坪）</option>
                <option value="210000">一森極致老屋翻新（約 18~25 萬/坪）</option>
                <option value="80000">微裝修 / 軟裝設計（約 6~10 萬/坪）</option>
            </select>
        </div>

        <button onclick="calculateBudget()">開始您的專屬預算試算</button>

        <!-- 結果展示區 -->
        <div class="result" id="resultBox" style="display: none;">
            <div class="result-title">預估總費用範圍</div>
            <div class="total-price" id="totalPrice">$0</div>
            
            <div class="detail-list">
                <p>建議預算分配比例：</p>
                <ul>
                    <li>一森林感基礎與木作：<span id="hardBuild">$0</span>（約 60%）</li>
                    <li>頂級家電與傢俱：<span id="furniture">$0</span>（約 30%）</li>
                    <li>極致軟裝與監工：<span id="decor">$0</span>（約 10%）</li>
                </ul>
            </div>
            
            <p class="note">※ 備註：此結果為基礎估算，實際費用仍需依現場丈量結果、設計細節及指定建材為準。</p>
            
            <!-- 預約諮詢按鈕 -->
            <a href="https://line.me" target="_blank" class="contact-btn">預約一森設計師現場丈量</a>
        </div>
    </div>

    <script>
        function calculateBudget() {
            const pingInput = document.getElementById('ping').value;
            const ping = parseFloat(pingInput);
            const costPerPing = parseFloat(document.getElementById('houseType').value);

            if (!ping || ping <= 0) {
                alert("請輸入正確的坪數！");
                return;
            }

            const totalEstimate = ping * costPerPing;
            const hardBuild = Math.round(totalEstimate * 0.6);
            const furniture = Math.round(totalEstimate * 0.3);
            const decor = Math.round(totalEstimate * 0.1);

            document.getElementById('totalPrice').innerText = `約 $${totalEstimate.toLocaleString()} 元起`;
            document.getElementById('hardBuild').innerText = `$${hardBuild.toLocaleString()} 元`;
            document.getElementById('furniture').innerText = `$${furniture.toLocaleString()} 元`;
            document.getElementById('decor').innerText = `$${decor.toLocaleString()} 元`;

            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
