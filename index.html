<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>裝修預算與未來規劃試算</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #F9F5F0 0%, #EFE8DF 100%);
      color: #4A3728;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    
    .mobile-container {
      width: 100%;
      max-width: 414px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 12px 0 18px 0;
    }
    .header .cafe-badge {
      display: inline-block;
      background: #4A3728;
      color: #F9F5F0;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 800;
      color: #362518;
      margin: 0 0 6px 0;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 13px;
      color: #8C7665;
      margin: 0;
    }

    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(74, 55, 40, 0.05);
      border: 1px solid #EFE5DA;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #8C5A32;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 裝修類型按鈕 */
    .preset-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .preset-btn {
      background: #FAF6F0;
      border: 1px solid #EFE5DA;
      border-radius: 12px;
      padding: 10px 4px;
      font-size: 11px;
      font-weight: 700;
      color: #6E5A4B;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      line-height: 1.3;
    }
    .preset-btn.active {
      background: #8C5A32;
      color: #FFFFFF;
      border-color: #8C5A32;
    }

    .input-item {
      margin-bottom: 12px;
    }
    .input-item:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #5C4737;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      height: 44px;
      background-color: #FAF6F0;
      border: 1.5px solid #EFE5DA;
      border-radius: 12px;
      padding: 0 36px 0 12px;
      font-size: 15px;
      font-weight: 700;
      color: #362518;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      background-color: #FFFFFF;
      border-color: #8C5A32;
      box-shadow: 0 0 0 3px rgba(140, 90, 50, 0.12);
    }

    .unit {
      position: absolute;
      right: 12px;
      font-size: 13px;
      color: #A39081;
      font-weight: 500;
      pointer-events: none;
    }

    .btn-calc {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #4A3728 0%, #322318 100%);
      color: #F9F5F0;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(74, 55, 40, 0.25);
      transition: transform 0.1s ease;
      margin-top: 4px;
    }
    .btn-calc:active { transform: scale(0.97); }

    .result-box {
      display: none;
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .gap-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(74, 55, 40, 0.08);
      margin-bottom: 14px;
      border: 1px solid #EFE5DA;
    }

    .gap-title {
      font-size: 13px;
      color: #8C7665;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .gap-amount {
      font-size: 32px;
      font-weight: 800;
      color: #C85A32;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .agent-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 22px 20px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(74, 55, 40, 0.06);
      border: 2px solid #EAE0D3;
    }

    .agent-avatar-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px auto;
      border: 3px solid #DCCBBA;
      box-shadow: 0 4px 12px rgba(74, 55, 40, 0.15);
      display: block;
    }

    .agent-name {
      font-size: 19px;
      font-weight: 800;
      color: #362518;
    }

    .agent-subtitle {
      font-size: 12px;
      color: #8C5A32;
      font-weight: 700;
      margin-top: 2px;
    }

    .agent-desc {
      font-size: 13px;
      color: #6E5A4B;
      margin: 10px 0 16px 0;
      line-height: 1.5;
      background: #FAF6F0;
      padding: 10px 14px;
      border-radius: 12px;
    }

    .btn-contact {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .btn-line-style {
      background-color: #06C755;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.2);
    }
  </style>
</head>
<body>

<div class="mobile-container">
  
  <div class="header">
    <div class="cafe-badge">HOME & BUDGET</div>
    <h1>裝修預算試算機 🏠</h1>
    <p>打造理想居家，為您快速評估預算需求</p>
  </div>

  <div class="card">
    <div class="section-title">🏡 1. 選擇裝修類型（低標估計）</div>
    
    <!-- 裝修類型切換按鈕 -->
    <div class="preset-group">
      <div class="preset-btn active" onclick="setRenovationType(1000000, this)">🆕 新成屋<br>100萬起</div>
      <div class="preset-btn" onclick="setRenovationType(2000000, this)">🏚️ 老屋翻新<br>200萬起</div>
      <div class="preset-btn" onclick="setRenovationType(600000, this)">🛠️ 微調裝修<br>60萬起</div>
    </div>

    <div class="input-item">
      <label>預計裝修預算</label>
      <div class="input-wrapper">
        <input type="number" id="renovationBudget" value="1000000">
        <span class="unit">元</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">💰 2. 目前已準備資金</div>

    <div class="input-item">
      <label>已準備自備款/裝修基金</label>
      <div class="input-wrapper">
        <input type="number" id="currentSavings" value="500000">
        <span class="unit">元</span>
      </div>
    </div>
  </div>

  <button class="btn-calc" onclick="calculate()">🔨 開始裝修預算試算</button>

  <div class="result-box" id="resultBox">
    <div style="height: 16px;"></div>

    <div class="gap-card">
      <div class="gap-title">預估裝修資金缺口</div>
      <div class="gap-amount" id="budgetGap">$0</div>
    </div>

    <div class="agent-card">
      <img src="avatar.jpg" class="agent-avatar-img" alt="陳瑩婕店長" onerror="this.src='https://picsum.photos/200'">
      <div class="agent-name">陳瑩婕</div>
      <div class="agent-subtitle">保險咖啡館 駐店顧問</div>
      
      <div class="agent-desc">
        🏠「讓每一分錢都花在刀口上」<br>
        想了解如何透過理財規劃或專屬保障，補足裝修資金缺口？歡迎加 LINE 免費諮詢！
      </div>
      
      <a href="https://lin.ee/9ul2awK" target="_blank" id="lineBtn" class="btn-contact btn-line-style">💬 加 LINE 傳送報告，領取專屬諮詢</a>
    </div>

  </div>

</div>

<script>
  function setRenovationType(amount, btnElement) {
    document.getElementById('renovationBudget').value = amount;
    const btns = document.querySelectorAll('.preset-btn');
    btns.forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
  }

  function calculate() {
    const budget = parseFloat(document.getElementById('renovationBudget').value) || 0;
    const savings = parseFloat(document.getElementById('currentSavings').value) || 0;
    const gap = Math.max(0, budget - savings);

    document.getElementById('budgetGap').innerText = '$' + gap.toLocaleString();

    const msg = encodeURIComponent(`店長你好，我試算了裝修預算：\n需求預算：$${budget.toLocaleString()}元\n已準備：$${savings.toLocaleString()}元\n預估資金缺口為：$${gap.toLocaleString()}元，想了解相關理財規劃！`);
    document.getElementById('lineBtn').href = `https://lin.ee/9ul2awK?text=${msg}`;

    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';
    resultBox.scrollIntoView({ behavior: 'smooth' });
  }
</script>

</body>
</html>
