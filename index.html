<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一森室內設計 ESAN | 理想生活提案指南</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1b241e;
            --card-bg: #fcfbf9;
            --gold-primary: #c5a880;
            --gold-light: #e8dcc8;
            --gold-dark: #9a7b52;
            --gold-glow: rgba(197, 168, 128, 0.15);
            --text-main: #242c27;
            --text-sub: #66726a;
            --border-light: #e8e4dc;
            --line-green: #06c755;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(197, 168, 128, 0.08) 0%, transparent 70%),
                radial-gradient(#2a362d 1px, transparent 1px);
            background-size: 100% 100%, 32px 32px;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            padding: 44px 38px;
            border-radius: 24px;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.45),
                0 0 0 1px rgba(197, 168, 128, 0.2);
            max-width: 560px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo-img {
            max-width: 120px;
            height: auto;
            margin: 0 auto;
            display: block;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06));
        }

        .page-title {
            font-size: 1.4rem;
            color: var(--text-main);
            text-align: center;
            margin: 18px 0 6px 0;
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        .page-subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.6;
            font-weight: 300;
        }

        .section-label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.04em;
        }

        .section-label::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--gold-primary);
            border-radius: 50%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            font-size: 0.9rem;
            color: var(--text-main);
            background-color: #ffffff;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 4px var(--gold-glow);
        }

        /* 風格選擇卡片 */
        .style-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .style-card {
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 12px;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .style-card:hover { border-color: var(--gold-primary); }

        .style-card.active {
            border-color: var(--gold-primary);
            background: linear-gradient(145deg, #ffffff, var(--gold-glow));
            box-shadow: 0 0 0 1px var(--gold-primary);
        }

        .style-card-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .style-card-desc {
            font-size: 0.73rem;
            color: var(--text-sub);
            line-height: 1.3;
        }

        .style-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4b892, #9a7b52);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.15em;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(154, 123, 82, 0.3);
            font-family: inherit;
        }

        .submit-btn:hover { opacity: 0.95; transform: translateY(-1px); }

        /* 圖檔預覽區 */
        .result-panel {
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px dashed var(--border-light);
            display: none;
            text-align: center;
        }

        .preview-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .preview-desc {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 18px;
        }

        #generatedImage {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid var(--border-light);
            margin-bottom: 20px;
        }

        .line-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--line-green);
            color: #ffffff;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(6, 199, 85, 0.22);
            letter-spacing: 0.05em;
        }

        .line-btn:hover { opacity: 0.92; transform: translateY(-1px); }

        .line-icon { width: 20px; height: 20px; fill: currentColor; }

        /* 隱藏畫布 Canvas */
        #cardCanvas { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <img src="logo.PNG" alt="一森室內設計" class="brand-logo-img">
        </div>

        <div class="page-title">理想生活規劃諮詢</div>
        <p class="page-subtitle">請填寫您的基本資訊與預算，系統將自動生成專屬諮詢圖檔</p>
        
        <!-- 1. 客戶個人資訊 -->
        <div class="section-label">基本聯絡資訊</div>
        <div class="form-group form-row">
            <input type="text" id="custName" placeholder="您的姓名 / 稱呼" required>
            <input type="text" id="custPhone" placeholder="聯絡電話" required>
        </div>

        <div class="form-group form-row">
            <input type="text" id="custProject" placeholder="建案名稱或地址">
            <select id="custTime">
                <option value="隨時皆可">方便聯絡時間：隨時皆可</option>
                <option value="平日白天 (09:00 - 18:00)">平日白天 (09:00 - 18:00)</option>
                <option value="平日晚上 (18:00 - 21:00)">平日晚上 (18:00 - 21:00)</option>
                <option value="假日/週末">假日 / 週末</option>
            </select>
        </div>

        <!-- 2. 預算與屋況 -->
        <div class="section-label">預算與房屋現況</div>
        <div class="form-group form-row">
            <input type="number" id="budgetInput" placeholder="預算金額（萬元）" min="30" value="100">
            <select id="houseType">
                <option value="新成屋">新成屋全域規劃</option>
                <option value="老屋翻新">老屋翻新重構</option>
                <option value="微裝修/軟裝">微裝修 / 局部軟裝</option>
            </select>
        </div>

        <!-- 3. 風格選擇卡片 -->
        <div class="section-label">嚮往的生活風格</div>
        <div class="style-grid">
            <label class="style-card active" onclick="selectStyle(this)">
                <input type="radio" name="styleChoice" value="簡約留白" checked>
                <div class="style-card-title">簡約留白</div>
                <div class="style-card-desc">極簡線條，流暢採光與呼吸感</div>
            </label>

            <label class="style-card" onclick="selectStyle(this)">
                <input type="radio" name="styleChoice" value="自然寂靜">
                <div class="style-card-title">自然寂靜</div>
                <div class="style-card-desc">手感塗料與溫潤木質氛圍</div>
            </label>

            <label class="style-card" onclick="selectStyle(this)">
                <input type="radio" name="styleChoice" value="飯店級輕奢">
                <div class="style-card-title">飯店級輕奢</div>
                <div class="style-card-desc">金屬細節、石材壁板與精緻光影</div>
            </label>

            <label class="style-card" onclick="selectStyle(this)">
                <input type="radio" name="styleChoice" value="尊爵訂製邸宅">
                <div class="style-card-title">尊爵訂製邸宅</div>
                <div class="style-card-desc">特殊工藝與頂級建材客製化</div>
            </label>
        </div>

        <!-- 4. 簡述需求 -->
        <div class="form-group">
            <div class="section-label">簡述裝修需求或重點</div>
            <textarea id="custNeeds" placeholder="例如：希望增加主臥收納、客廳要能擺放65吋電視、浴室乾濕分離..."></textarea>
        </div>

        <button class="submit-btn" onclick="generateImageCard()">一鍵生成專屬諮詢卡圖檔</button>

        <!-- 圖檔生成結論與預覽 -->
        <div class="result-panel" id="resultBox">
            <div class="preview-title">您的專屬需求諮詢卡已生成</div>
            <p class="preview-desc">請長按或點擊儲存上方圖檔，並將圖檔傳送至 LINE，專屬設計師將主動與您聯繫！</p>
            
            <img id="generatedImage" src="" alt="一森專屬諮詢卡">

            <a href="https://lin.ee/rMxsLCa" target="_blank" class="line-btn">
                <svg class="line-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 5.82 2 10.53c0 4.23 3.61 7.78 8.48 8.42.33.07.78.22.89.51.1.26.07.67.03.94l-.14.86c-.04.26-.2.1.03 1.18.23.23 1.25.75 2.06.32 2.74-1.61 7.65-4.5 7.65-11.23C22 5.82 17.52 2 12 2z"/>
                </svg>
                傳送圖檔至一森官方 LINE
            </a>
        </div>
    </div>

    <!-- 用於繪製圖檔的隱藏 Canvas -->
    <canvas id="cardCanvas" width="800" height="1050"></canvas>

    <script>
        function selectStyle(element) {
            document.querySelectorAll('.style-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
            element.querySelector('input[type="radio"]').checked = true;
        }

        function generateImageCard() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const project = document.getElementById('custProject').value.trim() || "未提供";
            const time = document.getElementById('custTime').value;
            const budget = document.getElementById('budgetInput').value;
            const houseType = document.getElementById('houseType').value;
            const style = document.querySelector('input[name="styleChoice"]:checked').value;
            const needs = document.getElementById('custNeeds').value.trim() || "無特別備註";

            if (!name || !phone) {
                alert("請填寫您的「姓名」與「聯絡電話」，以便設計師協助聯繫！");
                return;
            }

            // 開始繪製 Canvas
            const canvas = document.getElementById('cardCanvas');
            const ctx = canvas.getContext('2d');

            // 1. 背景底色
            ctx.fillStyle = "#faf8f5";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 奢華外框與邊角
            ctx.strokeStyle = "#c5a880";
            ctx.lineWidth = 6;
            ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

            ctx.strokeStyle = "rgba(197, 168, 128, 0.3)";
            ctx.lineWidth = 1;
            ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

            // 3. 標題與品牌
            ctx.fillStyle = "#9a7b52";
            ctx.font = "bold 32px 'Noto Serif TC', serif";
            ctx.textAlign = "center";
            ctx.fillText("一森室內設計 ESAN DESIGN", canvas.width / 2, 100);

            ctx.fillStyle = "#242c27";
            ctx.font = "bold 26px 'Noto Serif TC', serif";
            ctx.fillText("理想生活 ｜ 專屬裝修需求諮詢卡", canvas.width / 2, 145);

            // 分割線
            ctx.beginPath();
            ctx.moveTo(80, 175);
            ctx.lineTo(canvas.width - 80, 175);
            ctx.strokeStyle = "#e8e4dc";
            ctx.stroke();

            // 4. 客戶基本資訊區塊
            ctx.textAlign = "left";
            ctx.font = "bold 22px 'Noto Serif TC', serif";
            ctx.fillStyle = "#9a7b52";
            ctx.fillText("✦ 客戶基本資訊", 80, 220);

            ctx.font = "20px 'Noto Serif TC', serif";
            ctx.fillStyle = "#242c27";
            ctx.fillText(`稱　　呼：${name}`, 100, 265);
            ctx.fillText(`聯絡電話：${phone}`, 100, 305);
            ctx.fillText(`建案/地址：${project}`, 100, 345);
            ctx.fillText(`方便聯絡：${time}`, 100, 385);

            // 5. 裝修條件與預算
            ctx.font = "bold 22px 'Noto Serif TC', serif";
            ctx.fillStyle = "#9a7b52";
            ctx.fillText("✦ 空間規劃與預算方向", 80, 445);

            ctx.font = "20px 'Noto Serif TC', serif";
            ctx.fillStyle = "#242c27";
            ctx.fillText(`預算金額：約 ${budget} 萬元`, 100, 490);
            ctx.fillText(`房屋現況：${houseType}`, 100, 530);
            ctx.fillText(`嚮往風格：${style}`, 100, 570);

            // 6. 系統預估建議與結論
            ctx.font = "bold 22px 'Noto Serif TC', serif";
            ctx.fillStyle = "#9a7b52";
            ctx.fillText("✦ 系統初步分析建議", 80, 630);

            ctx.font = "18px 'Noto Serif TC', serif";
            ctx.fillStyle = "#66726a";
            let advice1 = `• 預算落在 ${budget} 萬，建議優先聚焦於「公領域門面收納與主臥室完整系統櫃」。`;
            let advice2 = `• 浴室全翻新門檻約 30 萬/間，將根據實際需求調配基礎工程比重。`;
            ctx.fillText(advice1, 100, 675);
            ctx.fillText(advice2, 100, 710);

            // 7. 簡述需求
            ctx.font = "bold 22px 'Noto Serif TC', serif";
            ctx.fillStyle = "#9a7b52";
            ctx.fillText("✦ 簡述需求與重點", 80, 770);

            ctx.font = "18px 'Noto Serif TC', serif";
            ctx.fillStyle = "#242c27";
            
            // 自動換行處理需求文字
            const maxCharPerLine = 32;
            let lineY = 810;
            for (let i = 0; i < needs.length; i += maxCharPerLine) {
                ctx.fillText(needs.substring(i, i + maxCharPerLine), 100, lineY);
                lineY += 30;
            }

            // 8. 頁腳引導
            ctx.fillStyle = "#9a7b52";
            ctx.fillRect(40, 950, canvas.width - 80, 50);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px 'Noto Serif TC', serif";
            ctx.textAlign = "center";
            ctx.fillText("請將此諮詢卡傳送至一森官方 LINE，將有專屬設計師為您服務", canvas.width / 2, 982);

            // 轉成 Base64 圖片並顯示
            const dataURL = canvas.toDataURL('image/png');
            document.getElementById('generatedImage').src = dataURL;

            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
